name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests use synthetic data in the Kaggle schema: no credentials or large downloads needed.
      - run: pytest -q
      - name: End-to-end smoke run on sample data
        run: python run_pipeline.py --sample
